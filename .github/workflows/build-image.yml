name: Build worker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - CloudronManifest.json
      - start.sh
      - server.js
      - patches/**
      - scalepass/**
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/scalepass/io.scalepass.aidevops.worker:patch-retirement-latest
            ghcr.io/scalepass/io.scalepass.aidevops.worker:${{ github.sha }}
